[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seshat"
version = "0.1.0"
description = "SOC AI assistant for alert filtering, semantic memory, and self-hosted LLM analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "chromadb>=0.4",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "httpx>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["seshat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
