source_type: csv
source_name: palo_alto_fw01

file_path: tests/fixtures/sample_firewall.csv
delimiter: ","

# Maps NormalizedAlert schema fields → CSV column names
field_mapping:
  timestamp:   timestamp
  severity:    severity
  category:    category
  action:      action
  description: description
  rule_name:   rule_name
  src_ip:      src_ip
  dst_ip:      dst_ip
  src_port:    src_port
  dst_port:    dst_port
  protocol:    protocol
  direction:   direction
  hostname:    hostname
  user:        user

mempalace:
  wing: Firewall
  room_field: severity  # alerts are partitioned by severity level
